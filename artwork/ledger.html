<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #0b0f14; }
  body { font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; color: #e6edf3; }
  .card { width: 100%; min-height: 100vh; display: flex; flex-direction: column; padding: 60px 60px 40px; }
  h2 { font-size: 34px; }
  h2 span { color: #3fb950; }
  .sub { margin-top: 10px; font-size: 17px; color: #9aa7b4; }
  .rows { margin-top: 48px; }
  .row { display: flex; align-items: center; gap: 20px; margin-bottom: 26px; }
  .label { width: 210px; font-size: 17px; color: #9aa7b4; text-align: right; }
  .track { flex: 1; height: 54px; background: #121821; border: 1px solid #1f2937; border-radius: 12px; overflow: hidden; }
  .fill { height: 100%; display: flex; align-items: center; justify-content: flex-end;
          padding-right: 16px; font-size: 17px; font-weight: 700; white-space: nowrap; }
  .a { width: 100%; background: linear-gradient(90deg,#8b3a3a,#b34747); color: #ffe9e9; }
  .b { width: 13%; background: linear-gradient(90deg,#1f6feb,#3fb950); color: #06210f; }
  .note { margin-top: auto; padding-top: 24px; border-top: 1px solid #1f2937;
          font-size: 16px; color: #8b949e; line-height: 1.85; }
  code { font-family: Consolas, monospace; color: #e6edf3; background: #161b22; padding: 2px 7px; border-radius: 5px; }
</style></head>
<body><div class="card">
  <h2>一次调用的<span>账本</span>：原文 vs 摘要</h2>
  <div class="sub">web_digest 返回头里的真实数字</div>

  <div class="rows">
    <div class="row">
      <div class="label">抓回来的正文</div>
      <div class="track"><div class="fill a">12,000 字符 · 约 4,800 tokens</div></div>
    </div>
    <div class="row">
      <div class="label">返回的摘要</div>
      <div class="track"><div class="fill b">940</div></div>
    </div>
  </div>

  <div class="note">
    <b>相关性闸门</b>：不命中查询词的页面被弃用（结果里列出域名），不硬凑摘要。<br>
    <b>跨页去重</b>：三个站说同一件事时只留第一份 —— 省 10–20% 预算且不丢信息。<br>
    <b>账本口径</b>：<code>正文 12000 字符 → 摘要 940 字符（压缩 92%）</code>
  </div>
</div></body></html>
